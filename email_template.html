<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twoja codzienna dawka inspiracji</title>
</head>
<body style="margin:0; padding:0; background-color:#0f0f0f; font-family: Georgia, 'Times New Roman', serif;">
 
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0f0f0f; padding: 48px 16px;">
    <tr>
      <td align="center">
 
        <!-- Card -->
        <table width="560" cellpadding="0" cellspacing="0" border="0"
               style="max-width:560px; width:100%; background-color:#161616; border-radius:4px; overflow:hidden;">
 
          <!-- Top accent bar -->
          <tr>
            <td style="height:3px; background: linear-gradient(90deg, #c9a96e 0%, #e8d5a3 50%, #c9a96e 100%);"></td>
          </tr>
 
          <!-- Header -->
          <tr>
            <td align="center" style="padding: 48px 48px 32px 48px;">
              <p style="margin:0; font-family: Georgia, serif; font-size:11px; letter-spacing:4px; text-transform:uppercase; color:#c9a96e;">
                Cytat dnia
              </p>
            </td>
          </tr>
 
          <!-- Ornament top -->
          <tr>
            <td align="center" style="padding: 0 48px 24px 48px;">
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="width:40px; height:1px; background-color:#333;"></td>
                  <td style="width:10px;"></td>
                  <td style="font-size:18px; color:#c9a96e; line-height:1;">✦</td>
                  <td style="width:10px;"></td>
                  <td style="width:40px; height:1px; background-color:#333;"></td>
                </tr>
              </table>
            </td>
          </tr>
 
          <!-- Quote mark -->
          <tr>
            <td style="padding: 0 48px; color:#c9a96e; font-size:72px; line-height:0.7; font-family: Georgia, serif;">
              &ldquo;
            </td>
          </tr>
 
          <!-- Quote text -->
          <tr>
            <td style="padding: 16px 48px 24px 48px;">
              <p style="margin:0; font-family: Georgia, 'Times New Roman', serif; font-size:22px; line-height:1.7; color:#f0ead6; font-style:italic; text-align:center;">
                $cytat
              </p>
            </td>
          </tr>
 
          <!-- Author -->
          <tr>
            <td align="center" style="padding: 0 48px 16px 48px;">
              <p style="margin:0; font-family: Georgia, serif; font-size:13px; letter-spacing:2px; text-transform:uppercase; color:#888;">
                &mdash;&nbsp;$autor
              </p>
            </td>
          </tr>
 
          <!-- Ornament bottom -->
          <tr>
            <td align="center" style="padding: 16px 48px 40px 48px;">
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="width:40px; height:1px; background-color:#333;"></td>
                  <td style="width:10px;"></td>
                  <td style="font-size:18px; color:#c9a96e; line-height:1;">✦</td>
                  <td style="width:10px;"></td>
                  <td style="width:40px; height:1px; background-color:#333;"></td>
                </tr>
              </table>
            </td>
          </tr>
 
          <!-- Divider -->
          <tr>
            <td style="padding: 0 48px;">
              <div style="height:1px; background-color:#222;"></div>
            </td>
          </tr>
 
          <!-- CTA Button -->
          <tr>
            <td align="center" style="padding: 40px 48px;">
              <a href="$link"
                 style="display:inline-block; padding:14px 36px; background-color:transparent;
                        border:1px solid #c9a96e; border-radius:2px;
                        font-family: Georgia, serif; font-size:12px; letter-spacing:3px;
                        text-transform:uppercase; color:#c9a96e; text-decoration:none;">
                Zobacz cytat
              </a>
            </td>
          </tr>
 
          <!-- Footer -->
          <tr>
            <td align="center" style="padding: 0 48px 40px 48px;">
              <p style="margin:0; font-size:11px; color:#444; font-family: Georgia, serif; line-height:1.8;">
                Otrzymujesz tę wiadomość, ponieważ jesteś zapisany na codzienne cytaty.<br/>
              </p>
            </td>
          </tr>
 
          <!-- Bottom accent bar -->
          <tr>
            <td style="height:3px; background: linear-gradient(90deg, #c9a96e 0%, #e8d5a3 50%, #c9a96e 100%);"></td>
          </tr>
 
        </table>
        <!-- /Card -->
 
      </td>
    </tr>
  </table>
 
</body>
</html>
